<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>ABC Company - Secure Login</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
</head>
<body class="bg-slate-50 flex items-center justify-center min-h-screen">
    <div class="bg-white border border-red-100 p-8 rounded-3xl shadow-xl max-w-sm w-full space-y-6">
        <div class="text-center">
            <div class="bg-red-600 text-white w-12 h-12 mx-auto rounded-2xl flex items-center justify-center font-bold shadow-md shadow-red-600/20 mb-3">
                <i class="fa-solid fa-lock"></i>
            </div>
            <h2 class="text-xl font-bold text-slate-900">ABC COMPANY</h2>
            <p class="text-xs text-slate-500 mt-1">Lifecycle Tracker Portal</p>
        </div>

        <form onsubmit="handleLogin(event)" class="space-y-4">
            <div>
                <label class="block text-xs uppercase tracking-wider text-slate-500 font-semibold mb-1">Select Role</label>
                <select id="loginRole" class="w-full bg-slate-50 border border-slate-200 rounded-xl px-4 py-2.5 text-sm focus:outline-none focus:border-red-600 transition">
                    <option value="admin">Admin</option>
                    <option value="staff">Staff / Technician</option>
                </select>
            </div>

            <div>
                <label class="block text-xs uppercase tracking-wider text-slate-500 font-semibold mb-1">Username</label>
                <input type="text" id="loginUser" required placeholder="Enter username" class="w-full bg-slate-50 border border-slate-200 rounded-xl px-4 py-2.5 text-sm focus:outline-none focus:border-red-600 transition">
            </div>

            <div>
                <label class="block text-xs uppercase tracking-wider text-slate-500 font-semibold mb-1">Password</label>
                <input type="password" id="loginPass" required placeholder="Enter password" class="w-full bg-slate-50 border border-slate-200 rounded-xl px-4 py-2.5 text-sm focus:outline-none focus:border-red-600 transition">
            </div>

            <button type="submit" class="w-full bg-red-600 hover:bg-red-700 text-white font-semibold py-3 rounded-xl transition text-sm shadow-md shadow-red-600/20 mt-2">
                Secure Login
            </button>
        </form>
    </div>

    <script>
        function handleLogin(e) {
            e.preventDefault();
            const role = document.getElementById('loginRole').value;
            const username = document.getElementById('loginUser').value.trim();
            const password = document.getElementById('loginPass').value.trim();

            if (role === 'admin') {
                if (username === 'admin' && password === 'admin123') {
                    localStorage.setItem('abc_logged_in', 'true');
                    localStorage.setItem('abc_user', 'admin');
                    window.location.href = 'index.html';
                } else {
                    alert('Invalid Admin Username or Password! ');
                }
            } else if (role === 'staff') {
                if (username === 'staff' && password === 'staff123') {
                    localStorage.setItem('abc_logged_in', 'true');
                    localStorage.setItem('abc_user', 'staff');
                    window.location.href = 'index.html';
                } else {
                    alert('Invalid Staff Username or Password!');
                }
            }
        }
    </script>
</body>
</html>
